<!doctype html>
<html lang="tr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hybrid</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hybrid">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F3EE" id="theme-color">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/app.css">
<script>
// Tema, sayfa çizilmeden önce uygulanır (açılışta renk sıçraması olmasın).
try { document.documentElement.dataset.theme = localStorage.getItem('tema') || 'auto'; } catch (e) {}
</script>
</head>
<body>
<div id="app">
  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Sekmeler">
    <button class="tab" data-tab="bugun">
      <span class="tab-line"></span>
      <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><line x1="4" y1="10" x2="20" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>
      <span class="tab-label">Bugün</span>
    </button>
    <button class="tab" data-tab="antrenman">
      <span class="tab-line"></span>
      <svg aria-hidden="true" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="6" y1="7" x2="6" y2="17"/><line x1="18" y1="7" x2="18" y2="17"/><line x1="3.5" y1="9.5" x2="3.5" y2="14.5"/><line x1="20.5" y1="9.5" x2="20.5" y2="14.5"/></svg>
      <span class="tab-label">Antrenman</span>
    </button>
    <button class="tab" data-tab="beslenme">
      <span class="tab-line"></span>
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 3v8a2.5 2.5 0 0 0 5 0V3"/><line x1="9.5" y1="3" x2="9.5" y2="21"/><path d="M17 21V3c-2 1.5-3 4-3 7 0 1.5 1 2.5 3 2.5"/></svg>
      <span class="tab-label">Beslenme</span>
    </button>
    <button class="tab" data-tab="plan">
      <span class="tab-line"></span>
      <svg aria-hidden="true" viewBox="0 0 24 24"><line x1="9" y1="7" x2="20" y2="7"/><line x1="9" y1="12" x2="20" y2="12"/><line x1="9" y1="17" x2="20" y2="17"/><circle cx="5" cy="7" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="17" r="1"/></svg>
      <span class="tab-label">Plan</span>
    </button>
  </nav>
</div>

<dialog id="ayarlar" aria-labelledby="ayarlar-baslik">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="ayarlar-baslik">Ayarlar</h2>
      <button class="icon-btn" id="ayarlar-kapat" aria-label="Kapat">
        <svg aria-hidden="true" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
      </button>
    </div>

    <h3>Tema</h3>
    <div class="segment" role="group" aria-label="Tema">
      <button data-tema="auto">Sistem</button>
      <button data-tema="light">Açık</button>
      <button data-tema="dark">Koyu</button>
    </div>

    <h3>Yedek</h3>
    <p class="muted">Veriler yalnızca bu telefonda durur. Ara sıra yedek alıp Dosyalar'a kaydet.</p>
    <button class="btn btn-outline" id="yedek-al">Yedeği indir</button>
    <button class="btn btn-outline" id="yedek-yukle">Yedekten geri yükle</button>
    <input type="file" id="yedek-dosya" accept="application/json,.json" hidden>
    <p class="muted" id="yedek-durum" role="status"></p>

    <p class="muted small" id="surum"></p>
  </div>
</dialog>

<dialog id="sheet"></dialog>

<script type="module" src="./js/app.js"></script>
</body>
</html>
